name: Build Multi-OS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller fastapi uvicorn psutil httpx pyyaml pydantic discord.py

    - name: Build with PyInstaller
      run: |
        pyinstaller --name "EmberCore" --icon "icon.ico" --onefile ^
        --collect-all core ^
        --collect-all discord ^
        --collect-all fastapi ^
        --add-data "backend/static;static" ^
        --add-data "backend/dev_plugins;dev_plugins" ^
        --add-data "version.json;." ^
        --clean --noconfirm backend/main.py || exit 1

    - name: Create ZIP (Für Auto-Updater)
      run: Compress-Archive -Path dist\EmberCore.exe -DestinationPath EmberCore_Windows_${{ github.ref_name }}.zip

    - name: Write Inno Setup Script
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        $iss = @"
        [Setup]
        AppName=EmberCore
        AppVersion=$version
        DefaultDirName=C:\EmberCore
        DefaultGroupName=EmberCore
        UninstallDisplayIcon={app}\EmberCore.exe
        SetupIconFile=icon.ico
        Compression=lzma2
        SolidCompression=yes
        OutputDir=.
        OutputBaseFilename=EmberCore_Setup_Windows_${{ github.ref_name }}
        PrivilegesRequired=admin

        [Files]
        Source: "dist\EmberCore.exe"; DestDir: "{app}"; Flags: ignoreversion
        Source: "backend\static\*"; DestDir: "{app}\static"; Flags: recursesubdirs
        Source: "backend\dev_plugins\*"; DestDir: "{app}\dev_plugins"; Flags: recursesubdirs
        Source: "version.json"; DestDir: "{app}"; Flags: ignoreversion

        [Icons]
        Name: "{autoprograms}\EmberCore"; Filename: "{app}\EmberCore.exe"
        Name: "{autodesktop}\EmberCore"; Filename: "{app}\EmberCore.exe"; Tasks: desktopicon

        [Tasks]
        Name: "desktopicon"; Description: "Desktop-Symbol erstellen"; GroupDescription: "Zusätzliche Symbole:"

        [Run]
        Filename: "{app}\EmberCore.exe"; Description: "EmberCore jetzt starten"; Flags: nowait postinstall skipifsilent runasoriginaluser
        "@
        Set-Content -Path installer.iss -Value $iss -Encoding UTF8

    - name: Compile Windows Setup.exe
      shell: pwsh
      run: |
        $issPath = "installer.iss"
        $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (Test-Path $isccPath) {
            & $isccPath $issPath
        } else {
            Write-Error "Inno Setup nicht gefunden unter $isccPath"
            exit 1
        }

    - name: Upload Windows Release Files
      uses: softprops/action-gh-release@v1
      with:
        files: |
          EmberCore_Windows_${{ github.ref_name }}.zip
          EmberCore_Setup_Windows_${{ github.ref_name }}.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies & Makeself
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller fastapi uvicorn psutil httpx pyyaml pydantic discord.py
        sudo apt-get update && sudo apt-get install -y makeself

    - name: Build with PyInstaller
      run: |
        pyinstaller --name "EmberCore" --onefile \
        --collect-all core \
        --collect-all discord \
        --collect-all fastapi \
        --add-data "backend/static:static" \
        --add-data "backend/dev_plugins:dev_plugins" \
        --add-data "version.json:." \
        --clean --noconfirm backend/main.py || exit 1

    - name: Create TAR.GZ (Für Auto-Updater)
      run: tar -czvf EmberCore_Linux_${{ github.ref_name }}.tar.gz -C dist EmberCore

    - name: Prepare Linux Setup Script
      run: |
        mkdir -p dist/EmberCore_Setup
        cp dist/EmberCore dist/EmberCore_Setup/
        cp -R backend/static dist/EmberCore_Setup/
        cp -R backend/dev_plugins dist/EmberCore_Setup/
        cp version.json dist/EmberCore_Setup/
        
        cat << 'EOF' > dist/EmberCore_Setup/install.sh
        #!/bin/bash
        TARGET="/opt/EmberCore"
        sudo mkdir -p "$TARGET"
        sudo cp -R ./* "$TARGET/"
        sudo chmod +x "$TARGET/EmberCore"
        echo "✅ EmberCore installiert unter $TARGET"
        EOF
        chmod +x dist/EmberCore_Setup/install.sh

    - name: Compile Linux .run Installer
      run: makeself dist/EmberCore_Setup EmberCore_Setup_Linux_${{ github.ref_name }}.run "EmberCore Linux Installer" ./install.sh

    - name: Upload Linux Release Files
      uses: softprops/action-gh-release@v1
      with:
        files: |
          EmberCore_Linux_${{ github.ref_name }}.tar.gz
          EmberCore_Setup_Linux_${{ github.ref_name }}.run
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
