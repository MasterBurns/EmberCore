name: Build Multi-OS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ==========================================
  # WINDOWS BUILD (Setup EXE & Auto-Update ZIP)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller fastapi uvicorn psutil httpx pyyaml pydantic

    - name: Build with PyInstaller
      run: |
        pyinstaller --name "EmberCore" --add-data "backend/static;static" --add-data "backend/dev_plugins;dev_plugins" --add-data "version.json;." --clean --noconfirm backend/main.py

    - name: Create ZIP (Für Auto-Updater)
      run: |
        Compress-Archive -Path dist\EmberCore\* -DestinationPath EmberCore_Windows_${{ github.ref_name }}.zip

    - name: Write Inno Setup Script
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        $iss = @"
        [Setup]
        AppName=EmberCore
        AppVersion=$version
        DefaultDirName={commonpf}\EmberCore
        DefaultGroupName=EmberCore
        UninstallDisplayIcon={app}\EmberCore.exe
        Compression=lzma2
        SolidCompression=yes
        OutputDir=.
        OutputBaseFilename=EmberCore_Setup_Windows_${{ github.ref_name }}
        PrivilegesRequired=admin

        [Files]
        Source: "dist\EmberCore\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

        [Icons]
        Name: "{autoprograms}\EmberCore"; Filename: "{app}\EmberCore.exe"
        Name: "{autodesktop}\EmberCore"; Filename: "{app}\EmberCore.exe"; Tasks: desktopicon

        [Tasks]
        Name: "desktopicon"; Description: "Desktop-Symbol erstellen"; GroupDescription: "Zusätzliche Symbole:"

        [Run]
        Filename: "{app}\EmberCore.exe"; Description: "EmberCore jetzt starten"; Flags: nowait postinstall skipifsilent
        "@
        Set-Content -Path installer.iss -Value $iss -Encoding UTF8

    - name: Compile Windows Setup.exe
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Upload Windows Release Files
      uses: softprops/action-gh-release@v1
      with:
        files: |
          EmberCore_Windows_${{ github.ref_name }}.zip
          EmberCore_Setup_Windows_${{ github.ref_name }}.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # LINUX BUILD (Setup RUN & Auto-Update TAR.GZ)
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies & Makeself
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller fastapi uvicorn psutil httpx pyyaml pydantic
        sudo apt-get update && sudo apt-get install -y makeself

    - name: Build with PyInstaller
      run: |
        # Unter Linux nutzt PyInstaller Doppelpunkte (:) statt Semikolons (;) bei add-data
        pyinstaller --name "EmberCore" --add-data "backend/static:static" --add-data "backend/dev_plugins:dev_plugins" --add-data "version.json:." --clean --noconfirm backend/main.py

    - name: Create TAR.GZ (Für Auto-Updater)
      run: |
        cd dist/EmberCore
        tar -czvf ../../EmberCore_Linux_${{ github.ref_name }}.tar.gz .
        cd ../..

    - name: Prepare Linux Setup Script
      run: |
        mkdir -p dist/EmberCore_Setup
        cp -R dist/EmberCore/* dist/EmberCore_Setup/
        cat << 'EOF' > dist/EmberCore_Setup/install.sh
        #!/bin/bash
        echo "🔥 Installiere EmberCore..."
        TARGET="/opt/EmberCore"

        if [ "$EUID" -ne 0 ]; then
          echo "Installation benötigt Root-Rechte. Bitte Passwort eingeben:"
          sudo mkdir -p "$TARGET"
          sudo cp -R ./* "$TARGET/"
          sudo chmod +x "$TARGET/EmberCore"
        else
          mkdir -p "$TARGET"
          cp -R ./* "$TARGET/"
          chmod +x "$TARGET/EmberCore"
        fi

        echo "✅ Installation abgeschlossen!"
        echo "EmberCore liegt in $TARGET."
        echo "Tippe im Terminal einfach 'sudo $TARGET/EmberCore' ein, um das Panel zu starten."
        EOF
        chmod +x dist/EmberCore_Setup/install.sh

    - name: Compile Linux .run Installer
      run: makeself dist/EmberCore_Setup EmberCore_Setup_Linux_${{ github.ref_name }}.run "EmberCore Linux Installer" ./install.sh

    - name: Upload Linux Release Files
      uses: softprops/action-gh-release@v1
      with:
        files: |
          EmberCore_Linux_${{ github.ref_name }}.tar.gz
          EmberCore_Setup_Linux_${{ github.ref_name }}.run
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
