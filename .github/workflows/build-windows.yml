name: Build Windows EXE

# Dieser Workflow startet, wenn du einen neuen Release-Tag (z.B. v0.2.0) auf GitHub pushst
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install fastapi uvicorn psutil httpx pyyaml pydantic

    - name: Build with PyInstaller
      run: |
        pyinstaller --name "EmberCore" --add-data "backend/static;static" --add-data "backend/dev_plugins;dev_plugins" --add-data "version.json;." --clean --noconfirm backend/main.py

    # HIER GEÄNDERT: Die ZIP-Datei bekommt direkt beim Erstellen die Versionsnummer
    - name: Zip the Output
      run: |
        Compress-Archive -Path dist\EmberCore\* -DestinationPath EmberCore_Windows_${{ github.ref_name }}.zip

    # HIER GEÄNDERT: Upload sucht exakt nach dem Namen aus dem Schritt drüber
    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        files: EmberCore_Windows_${{ github.ref_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
